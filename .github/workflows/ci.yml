name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  django-tests:
    name: Django Tests & Metrics Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Django System Check
        run: python app/manage.py check
        env:
          SECRET_KEY: 'ci-secret-key'
          DEBUG: 'True'

      - name: Test Static Files Collection (WhiteNoise)
        run: python app/manage.py collectstatic --noinput
        env:
          SECRET_KEY: 'ci-secret-key'

      - name: Run Database Migrations
        run: python app/manage.py migrate
        env:
          SECRET_KEY: 'ci-secret-key'

      - name: Run Automated Tests
        run: python app/manage.py test chaos -v 2
        env:
          SECRET_KEY: 'ci-secret-key'

  docker-validation:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Django Docker Image
        run: docker build -t django-observability-app:test app/
